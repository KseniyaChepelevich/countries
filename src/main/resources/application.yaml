spring:
  application:
    name: countries
  datasource:
    url: 'jdbc:mysql://localhost:3306/countries?createDatabaseIfNotExist=true'
    hikari:
      connection-timeout: 20000
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 10000
      max-lifetime: 1000
      auto-commit: true
      schemas: countries
    username: root
    password: secret
  flyway:
    enabled: true
    repair-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 0
    schemas: countries
    locations: classpath:db/migration/countries
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    generate-ddl: false
    open-in-view: false
server:
  port: 8282
